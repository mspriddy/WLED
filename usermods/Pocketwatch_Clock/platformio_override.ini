; Rename this file to platformio_override.ini and place it in the ROOT of
; the WLED source folder (next to platformio.ini).
;
; The [platformio] section tells GitHub's automatic build (Actions) to
; build ONLY this one environment, instead of all ~50 WLED board targets.

[platformio]
default_envs = pocketwatch_c3

[env:pocketwatch_c3]
extends = env:esp32c3dev
custom_usermods = ${common.default_usermods} Pocketwatch_Clock
